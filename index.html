<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Magic Photo Frame</title>
<script async src="https://docs.opencv.org/4.x/opencv.js"></script>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;width:100%;min-height:100%;background:#111;color:#fff;font-family:Arial,sans-serif;text-align:center}
h1{margin:14px 0 8px;font-size:23px}
#camera{width:100%;max-width:700px;height:auto;display:block;margin:0 auto;background:#000}
#canvas{display:none}
#status{margin:10px 12px;min-height:28px;font-size:17px}
#startButton,#playSoundButton{padding:14px 24px;font-size:18px;border:0;border-radius:9px;cursor:pointer}
#startButton:disabled{opacity:.5}
#videoContainer{display:none;position:fixed;inset:0;background:#000;z-index:100;align-items:center;justify-content:center}
#videoPlayer{width:100%;height:100%;object-fit:contain}
#closeVideo{position:absolute;top:max(15px,env(safe-area-inset-top));right:15px;z-index:102;padding:10px 18px;font-size:18px}
#soundPanel{display:none;position:absolute;left:0;right:0;bottom:max(30px,env(safe-area-inset-bottom));z-index:103}
#playSoundButton{background:#fff;color:#000;font-weight:bold}
</style>
</head>
<body>
<h1>HALF SAREE FUNCTION PHOTO FRAME</h1>
<button id="startButton" onclick="startScanner()" disabled>LOADING...</button>
<video id="camera" autoplay playsinline muted></video>
<canvas id="canvas"></canvas>
<div id="status">Loading scanner...</div>

<div id="videoContainer">
<button id="closeVideo" onclick="closeVideo()">✕</button>
<video id="videoPlayer" controls playsinline preload="metadata"></video>
<div id="soundPanel">
<button id="playSoundButton" onclick="enableSound()">🔊 TAP FOR SOUND</button>
</div>
</div>

<script>
const GITHUB_BASE = "https://vishwanathyeramsetty.github.io/GayathriMagicPhotoFrame/";

const photoVideos = Array.from({length: 6}, (_, i) => {
  const n = String(i + 1).padStart(3, "0");
  return {
    id: "PHOTO_" + n,
    image: GITHUB_BASE + "photos/PHOTO_" + n + ".jpg",
    // Your GitHub files use the exact uppercase .JPG extension.
    imageCandidates: [
      GITHUB_BASE + "photos/PHOTO_" + n + ".JPG",
      GITHUB_BASE + "photos/PHOTO_" + n + ".jpg",
      GITHUB_BASE + "photos/PHOTO_" + n + ".JPEG",
      GITHUB_BASE + "photos/PHOTO_" + n + ".jpeg",
      GITHUB_BASE + "photos/PHOTO_" + n + ".PNG",
      GITHUB_BASE + "photos/PHOTO_" + n + ".png",
      GITHUB_BASE + "PHOTO_" + n + ".JPG",
      GITHUB_BASE + "PHOTO_" + n + ".jpg"
    ],
    video: GITHUB_BASE + "PHOTO_" + n + ".mp4"
  };
});

let camera,canvas,context,statusText,startButton,videoContainer,videoPlayer,soundPanel;
let referencePhotos=[],liveOrb=null,scannerRunning=false,videoPlaying=false,lastDetectionTime=0,lastScanTime=0;

// False-positive protection: the same photo must win several
// consecutive scans before any video is opened.
let candidateId=null;
let candidateCount=0;
const REQUIRED_MATCHES=30;
const REQUIRED_CONFIRMATIONS=3;
const MATCH_RATIO=0.70;

function onOpenCvReady(){
 statusText.innerText="OpenCV ready. Press START SCANNER.";
 startButton.disabled=false; startButton.innerText="START SCANNER";
}

async function loadReferencePhoto(photo){
 return new Promise((resolve,reject)=>{
  const img=new Image();
  img.onload=function(){
   try{
    const targetWidth=640,scale=targetWidth/img.width;
    const refCanvas=document.createElement("canvas");
    refCanvas.width=targetWidth; refCanvas.height=Math.round(img.height*scale);
    const ctx=refCanvas.getContext("2d");
    ctx.drawImage(img,0,0,refCanvas.width,refCanvas.height);
    const mat=cv.imread(refCanvas),gray=new cv.Mat();
    cv.cvtColor(mat,gray,cv.COLOR_RGBA2GRAY);
    const orb=new cv.ORB(800),keypoints=new cv.KeyPointVector(),descriptors=new cv.Mat();
    orb.detectAndCompute(gray,new cv.Mat(),keypoints,descriptors);
    referencePhotos.push({id:photo.id,video:photo.video,descriptors:descriptors.clone()});
    mat.delete();gray.delete();orb.delete();keypoints.delete();descriptors.delete();
    resolve();
   }catch(error){reject(error)}
  };
  const candidates = photo.imageCandidates || [photo.image];
  let candidateIndex = 0;
  img.onerror = function() {
   candidateIndex++;
   if(candidateIndex < candidates.length) {
    img.src = candidates[candidateIndex];
   } else {
    reject(new Error(
     "Could not find " + photo.id + " image. Check the photos folder and exact filename/extension (for example PHOTO_001.jpg)."
    ));
   }
  };
  img.src = candidates[0];
 });
}

async function loadReferencePhotos(){
 statusText.innerText="Loading reference photos...";
 referencePhotos=[];
 for(const photo of photoVideos) await loadReferencePhoto(photo);
 statusText.innerText="Ready. Point camera at a Half Saree function photo.";
}

async function startScanner(){
 if(scannerRunning||videoPlaying)return;
 if(typeof cv==="undefined"||!cv.Mat){
  statusText.innerText="Please wait for OpenCV to finish loading.";return;
 }
 try{
  startButton.disabled=true; statusText.innerText="Starting rear camera...";
  const stream=await navigator.mediaDevices.getUserMedia({
   video:{facingMode:{ideal:"environment"},width:{ideal:1280},height:{ideal:720}},
   audio:false
  });
  camera.srcObject=stream; await camera.play();
  candidateId=null; candidateCount=0;
  if(referencePhotos.length===0) await loadReferencePhotos();
  if(!liveOrb) liveOrb=new cv.ORB(800);
  scannerRunning=true; startButton.innerText="SCANNING...";
  statusText.innerText="Scanning... Point camera at a Half Saree function photo (PHOTO_001–PHOTO_006).";
  lastScanTime=0; requestAnimationFrame(scanFrame);
 }catch(error){
  console.error(error); scannerRunning=false; startButton.disabled=false; startButton.innerText="START SCANNER";
  if(error.name==="NotAllowedError") statusText.innerText="Camera permission denied. Allow Camera for this website, then press START SCANNER.";
  else if(error.name==="NotFoundError") statusText.innerText="No camera found on this phone.";
  else statusText.innerText="Camera error: "+error.message;
 }
}

function scanFrame(timestamp){
 if(!scannerRunning||videoPlaying)return;
 if(timestamp-lastScanTime<250){requestAnimationFrame(scanFrame);return}
 lastScanTime=timestamp;
 try{
  const width=camera.videoWidth,height=camera.videoHeight;
  if(!width||!height){requestAnimationFrame(scanFrame);return}
  canvas.width=640; canvas.height=Math.round(height*(640/width));
  context.drawImage(camera,0,0,canvas.width,canvas.height);
  const frame=cv.imread(canvas),gray=new cv.Mat();
  cv.cvtColor(frame,gray,cv.COLOR_RGBA2GRAY);
  const keypoints=new cv.KeyPointVector(),descriptors=new cv.Mat();
  liveOrb.detectAndCompute(gray,new cv.Mat(),keypoints,descriptors);
  let bestPhoto=null,bestMatches=0;
  if(!descriptors.empty()){
   for(const reference of referencePhotos){
    const matcher=new cv.BFMatcher(cv.NORM_HAMMING,false);
    const matches=new cv.DMatchVectorVector();
    matcher.knnMatch(reference.descriptors,descriptors,matches,2);
    let goodMatches=0;
    for(let i=0;i<matches.size();i++){
     const pair=matches.get(i);
     if(pair.size()>=2){
      const first=pair.get(0),second=pair.get(1);
      if(first.distance<MATCH_RATIO*second.distance)goodMatches++;
     }
    }
    if(goodMatches>bestMatches){bestMatches=goodMatches;bestPhoto=reference}
    matches.delete();matcher.delete();
   }
  }
  // Require a strong match AND repeated confirmation.
  if(bestPhoto&&bestMatches>=REQUIRED_MATCHES){
   if(candidateId===bestPhoto.id){
    candidateCount++;
   }else{
    candidateId=bestPhoto.id;
    candidateCount=1;
   }

   statusText.innerText=
    bestPhoto.id+" detected: "+bestMatches+
    " matches ("+candidateCount+"/"+REQUIRED_CONFIRMATIONS+")";
  }else{
   candidateId=null;
   candidateCount=0;
   statusText.innerText="Scanning... Point camera at a photo.";
  }

  const now=Date.now();
  if(bestPhoto&&bestMatches>=REQUIRED_MATCHES&&
     candidateCount>=REQUIRED_CONFIRMATIONS&&
     now-lastDetectionTime>5000){
   lastDetectionTime=now;
   recognizePhoto(bestPhoto,bestMatches);
  }
  frame.delete();gray.delete();keypoints.delete();descriptors.delete();
 }catch(error){console.error("SCAN ERROR:",error)}
 if(scannerRunning&&!videoPlaying)requestAnimationFrame(scanFrame);
}

function recognizePhoto(photo,goodMatches){
 console.log("PHOTO RECOGNIZED:",photo.id,goodMatches); playVideo(photo.video);
}

async function playVideo(videoUrl){
 videoPlaying=true;scannerRunning=false;
 if(camera.srcObject){camera.srcObject.getTracks().forEach(track=>track.stop());camera.srcObject=null}
 videoContainer.style.display="flex";soundPanel.style.display="none";
 videoPlayer.src=videoUrl;videoPlayer.muted=false;videoPlayer.load();
 try{
  await videoPlayer.play();
 }catch(error){
  console.log("Autoplay with sound blocked on mobile.");
  videoPlayer.muted=true;
  try{await videoPlayer.play();soundPanel.style.display="block"}
  catch(secondError){console.error("VIDEO PLAY ERROR:",secondError);statusText.innerText="Tap the video PLAY button."}
 }
 videoPlayer.onended=function(){closeVideo()};
}

function enableSound(){
 videoPlayer.muted=false;soundPanel.style.display="none";
 videoPlayer.play().catch(error=>console.error("Sound enable error:",error));
}

function closeVideo(){
 videoPlayer.pause();videoPlayer.removeAttribute("src");videoPlayer.load();
 videoContainer.style.display="none";soundPanel.style.display="none";
 videoPlaying=false;candidateId=null;candidateCount=0;lastDetectionTime=Date.now();
 startButton.disabled=false;startButton.innerText="START SCANNER";
 statusText.innerText="Ready. Point camera at a Half Saree function photo.";
 setTimeout(()=>startScanner(),300);
}

window.addEventListener("load",function(){
 camera=document.getElementById("camera");canvas=document.getElementById("canvas");context=canvas.getContext("2d");
 statusText=document.getElementById("status");startButton=document.getElementById("startButton");
 videoContainer=document.getElementById("videoContainer");videoPlayer=document.getElementById("videoPlayer");soundPanel=document.getElementById("soundPanel");
 const checkOpenCV=setInterval(function(){
  if(typeof cv!=="undefined"&&cv.Mat){clearInterval(checkOpenCV);onOpenCvReady()}
 },300);
});
</script>
</body>
</html>
